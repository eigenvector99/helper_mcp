<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>에이전트 강의 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 레이아웃: 왼쪽 노선도(섹션 버튼) · 가운데 본문 · 오른쪽 개념 창.
   강의 슬라이드의 종이색 · 남색 · 주황을 그대로 쓴다. 점선 밑줄 = 개념, 화살표 = 다른 내용으로 이동. */
:root{
  --paper:#f6f5f1; --card:#fffefb; --shelf:#edebe5; --line:#d9d6ce;
  --ink:#1b2433; --ink-2:#4a5363; --ink-3:#6a7280;
  --accent:#b8501c; --accent-fill:#e0692b; --accent-tint:#fbe9df; --on-accent:#16202e;
  --blue:#2456b8; --blue-tint:#e3ecfa;
  --navy:#16202e; --navy-2:#2a3850; --navy-line:#33415a; --strong:#16202e;
  --on-navy:#f6f5f1; --on-navy-2:#b9c3d1; --on-navy-3:#8a94a3;
  --bubble:#2b5fc7; --cmt:#22304a; --flash:#ffd65c;
  --k-kw:#f08a4b; --k-str:#9fd3a8; --k-com:#8a94a3; --k-dec:#8fb4ff; --code-link:#ffc09c; --code-jump:#b3ccff;
  --ok:#1f6f47; --no:#a8321f;
  --shadow:0 18px 44px rgba(22,32,46,.18);
  --f-display:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',Menlo,Consolas,'D2Coding','Nanum Gothic Coding',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1620; --card:#18222f; --shelf:#1d2937; --line:#2c3a4e;
    --ink:#eef0f3; --ink-2:#b9c3d1; --ink-3:#8f9aab;
    --accent:#f08a4b; --accent-fill:#e0692b; --accent-tint:#38261b; --on-accent:#16202e;
    --blue:#8fb4ff; --blue-tint:#1c2c48;
    --navy:#0a1018; --navy-2:#1e2b3d; --navy-line:#2c3a4e; --strong:#2c3f5e;
    --ok:#74d3a0; --no:#ff9a8a;
    --shadow:0 18px 44px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1620; --card:#18222f; --shelf:#1d2937; --line:#2c3a4e;
  --ink:#eef0f3; --ink-2:#b9c3d1; --ink-3:#8f9aab;
  --accent:#f08a4b; --accent-fill:#e0692b; --accent-tint:#38261b; --on-accent:#16202e;
  --blue:#8fb4ff; --blue-tint:#1c2c48;
  --navy:#0a1018; --navy-2:#1e2b3d; --navy-line:#2c3a4e; --strong:#2c3f5e;
  --ok:#74d3a0; --no:#ff9a8a;
  --shadow:0 18px 44px rgba(0,0,0,.5);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.7;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:break-word}
h1,h2,h3,p,ul,ol{margin:0}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--accent-fill);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
code{font-family:var(--f-mono);font-size:.88em;background:var(--shelf);padding:.12em .42em;border-radius:5px;overflow-wrap:anywhere;word-break:normal}
img.ico{border-radius:22%;flex:none;display:block}

/* ── 틀 ── */
.app{display:grid;grid-template-columns:252px minmax(0,1fr) 372px;align-items:start}
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:22px 16px 28px;border-right:1px solid var(--line);background:var(--paper);z-index:20}
.main{min-width:0;padding:0 clamp(16px,4vw,52px) 96px}
.col{max-width:800px}
.panel{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--card);border-left:1px solid var(--line);padding:0 22px 40px;z-index:30}
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.45);z-index:25}

/* ── 왼쪽: 이름 · 찾기 · 노선도 ── */
.rail-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.brand{display:flex;flex-direction:column;text-decoration:none;line-height:1.25}
.brand small{font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--accent)}
.brand strong{font-family:var(--f-display);font-size:21px;font-weight:700}
.theme{display:grid;place-items:center;flex:none;border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:34px;padding:0;cursor:pointer;color:var(--ink-2)}
.theme svg{width:17px;height:17px}
.search{position:relative}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.search input::placeholder{color:var(--ink-3)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px;z-index:40;max-height:60vh;overflow-y:auto}
.res{display:flex;flex-direction:column;align-items:flex-start;gap:0;width:100%;padding:8px 10px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer;font-size:14px;line-height:1.4}
.res small{font-size:11.5px;color:var(--ink-3)}
.res.c small{color:var(--accent)}
.res:hover,.res.sel{background:var(--shelf)}
.res-none{padding:10px;font-size:13.5px;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:12px}
.nav-group,.route{display:flex;flex-direction:column;gap:2px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border:0;border-radius:10px;background:none;color:var(--ink-2);font-size:14.5px;font-weight:500;text-align:left;cursor:pointer;line-height:1.3}
.nav-btn:hover{background:var(--shelf)}
.nav-btn[aria-current="true"]{background:var(--strong);color:var(--on-navy)}
.route{position:relative;padding-block:4px}
.route::before{content:"";position:absolute;left:17px;top:22px;bottom:22px;width:2px;background:var(--line)}
.stop .dot{position:relative;flex:none;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2.5px solid var(--accent-fill)}
.stop[aria-current="true"] .dot{background:var(--accent-fill);border-color:var(--on-navy)}
.stop .st{display:flex;flex-direction:column}
.stop small{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--accent)}
.stop[aria-current="true"] small{color:var(--k-kw)}

/* ── 지나온 길 ── */
.trail{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:6px;padding:12px 0;background:var(--paper);border-bottom:1px solid var(--line);font-size:13px;overflow-x:auto;white-space:nowrap;scrollbar-width:thin}
.trail .back{position:sticky;left:0;z-index:1;box-shadow:8px 0 0 var(--paper);flex:none;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px}
.trail .back:disabled{opacity:.45;cursor:default}
.tr-h{flex:none;color:var(--ink-3);margin-left:10px}
.tr{flex:none;border:0;background:none;padding:3px 6px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-size:13px;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.tr:hover{background:var(--shelf)}
.tr.c{color:var(--accent)}
.tr.cur{font-weight:700;color:var(--ink)}
.sep{flex:none;color:var(--ink-3)}

/* ── 본문 ── */
.sec-head{display:flex;flex-direction:column;gap:10px;padding:34px 0 26px}
.eb{font-size:12.5px;font-weight:600;letter-spacing:.09em;color:var(--accent)}
.sec-head h1{font-family:var(--f-display);font-size:clamp(28px,4.4vw,38px);font-weight:700;line-height:1.2;text-wrap:balance}
.lead{font-size:17px;color:var(--ink-2);max-width:40em}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.toc-i,.chip{display:inline-flex;align-items:baseline;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:13.5px;text-decoration:none;color:var(--ink);line-height:1.35}
.toc-i:hover,.chip:hover{border-color:var(--accent-fill)}
.chip small{font-size:11.5px;color:var(--accent);font-weight:600}
.chip.c{border-style:dashed;color:var(--accent)}
.topic{position:relative;display:flex;flex-direction:column;gap:16px;padding:32px 14px 30px;margin-inline:-14px;border-radius:14px;scroll-margin-top:60px}
.topic::before{content:"";position:absolute;top:0;left:14px;right:14px;height:1px;background:var(--line)}
.topic:focus{outline:none}
.topic h2{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.3;text-wrap:balance}
.topic p{max-width:44em}
.topic.arrive{animation:arrive 1.9s ease-out}
@keyframes arrive{0%{background:var(--accent-tint)}100%{background:transparent}}
h3.sub{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:17.5px;font-weight:700;margin-top:6px}
a.cl{color:var(--accent);font-weight:500;text-decoration:underline dotted;text-decoration-thickness:1.5px;text-underline-offset:4px;border-radius:4px;cursor:pointer}
a.cl:hover,a.cl.on{background:var(--accent-tint)}
a.tl{color:var(--blue);font-weight:500;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;cursor:pointer}
a.tl::before{content:"→";display:inline-block;margin-right:3px;text-decoration:none}
a.tl:hover{background:var(--blue-tint);border-radius:4px}
.rel{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px}
.rel-h{flex:none;min-width:5.2em;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.muted{color:var(--ink-3);font-size:14px}

/* 알림 상자 */
.note{display:flex;flex-direction:column;gap:2px;padding:14px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);max-width:46em}
.note-tag{font-size:12px;font-weight:700;letter-spacing:.06em}
.note.key{background:var(--accent-tint);border-color:var(--accent-fill);font-weight:500}
.note.key .note-tag{color:var(--accent)}
.note.warn{border-color:var(--accent-fill);border-style:dashed}
.note.warn .note-tag{color:var(--accent)}
.note.tip{background:var(--blue-tint);border-color:transparent}
.note.tip .note-tag{color:var(--blue)}

/* 코드 */
.code{background:var(--navy);color:var(--on-navy);border-radius:14px;overflow:hidden}
.code-head{display:flex;align-items:center;gap:8px;padding:9px 12px 8px 18px;border-bottom:1px solid var(--navy-line);font-size:12.5px}
.code-head .file{margin-right:auto;font-family:var(--f-mono);color:var(--on-navy-2);overflow-wrap:anywhere}
.cbtn{border:1px solid var(--navy-line);background:none;color:var(--on-navy-2);border-radius:7px;padding:3px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
.cbtn:hover{color:var(--on-navy);border-color:var(--on-navy-3)}
.lines{list-style:none;padding:10px 0 12px;font-family:var(--f-mono);font-size:13.5px;line-height:1.7}
.ln{display:grid;grid-template-columns:34px minmax(0,1fr);padding:1px 16px 1px 0;border-left:3px solid transparent;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal}
.ln .g{text-align:center;user-select:none}
.ln .c{padding-left:2ch;text-indent:-2ch}
.ln.has-note{cursor:pointer}
.ln.has-note .g::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--k-kw);vertical-align:1px}
.ln.has-note:hover{background:rgba(255,255,255,.06)}
.ln.open{background:rgba(240,138,75,.16);border-left-color:var(--k-kw)}
.ln.open .g::before{background:var(--k-kw)}
.ln.lit{background-image:linear-gradient(100deg,transparent 0%,rgba(255,214,92,.34) 45%,transparent 70%);background-size:220% 100%;background-repeat:no-repeat;background-position:-120% 0;animation:sweep .75s ease-out}
@keyframes sweep{from{background-position:120% 0}to{background-position:-120% 0}}
.cmt{margin:3px 14px 9px 34px;padding:9px 14px 10px;border-radius:2px 12px 12px 12px;background:var(--cmt);color:var(--on-navy);font-family:var(--f-body);font-size:13.5px;line-height:1.65;white-space:normal;word-break:keep-all}
.cmt::before{content:"# ";font-family:var(--f-mono);color:var(--k-str)}
.cmt.show{animation:drop .3s ease-out}
@keyframes drop{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
.cmt code{background:rgba(255,255,255,.1)}
.cmt a.cl{color:var(--code-link)} .cmt a.cl:hover,.cmt a.cl.on{background:rgba(240,138,75,.25)}
.cmt a.tl{color:var(--code-jump)} .cmt a.tl:hover{background:rgba(143,180,255,.2)}
.code-hint{padding:0 18px 12px;font-size:12px;color:var(--on-navy-3)}
.k{color:var(--k-kw)} .s{color:var(--k-str)} .m{color:var(--k-com)} .d{color:var(--k-dec)}

/* 대화 */
.chat{display:flex;flex-direction:column;gap:10px;padding:16px 16px 18px;background:var(--navy);border-radius:16px;max-width:44em}
.chat-title{font-size:12.5px;font-weight:600;color:var(--on-navy-2)}
.msg{max-width:90%;padding:9px 14px;border-radius:14px;font-size:14px;line-height:1.6;color:var(--on-navy)}
.msg.me{align-self:flex-end;background:var(--bubble)}
.msg.bot{align-self:flex-start;background:var(--navy-2)}
.msg.sys{align-self:flex-start;border:1px solid var(--navy-line);font-family:var(--f-mono);font-size:13px;color:var(--on-navy-2)}
.msg.tool{align-self:flex-start;max-width:100%;padding:0 4px;font-family:var(--f-mono);font-size:12.5px;color:var(--on-navy-3);overflow-wrap:anywhere}

/* 카드 · 흐름 */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;padding:16px 16px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);text-decoration:none;min-width:0}
.card.dashed{border-style:dashed;border-color:var(--ink-3);background:transparent}
.card strong{font-family:var(--f-display);font-size:16.5px;line-height:1.35}
.card .ct{font-size:13.5px;color:var(--ink-2);line-height:1.55}
.tag{align-self:flex-start;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--accent)}
.tag.mono{font-family:var(--f-mono);letter-spacing:0;font-weight:600;overflow-wrap:anywhere}
.card .go{margin-top:auto;padding-top:6px;font-size:12px;font-weight:600;color:var(--blue)}
.card .go.c{color:var(--accent)}
a.card:hover{border-color:var(--accent-fill);border-style:solid}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.node{flex:1 1 118px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:14px 8px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);text-align:center;text-decoration:none;line-height:1.35}
.node strong{font-family:var(--f-display);font-size:15px;overflow-wrap:anywhere}
.node small{font-size:12px;color:var(--ink-2)}
.node .n-tag{font-size:11.5px;font-weight:700;color:var(--ink-3)}
.node svg{width:38px;height:38px;color:var(--ink-2)}
.node.line{border:2.5px solid var(--accent-fill)}
.node.fill{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent)}
.node.fill small,.node.fill .n-tag,.node.fill svg{color:var(--on-accent)}
.node.navy{background:var(--strong);border-color:var(--strong);color:var(--on-navy)}
.node.navy small,.node.navy svg{color:var(--on-navy-2)} .node.navy .n-tag{color:var(--k-kw)}
.node.dashed{border-style:dashed;border-color:var(--ink-3)}
a.node:hover{box-shadow:0 0 0 3px var(--accent-tint)}
.edge{flex:0 0 auto;align-self:center;display:flex;flex-direction:column;align-items:center;font-size:11.5px;color:var(--ink-3);line-height:1.2}
.edge i{font-style:normal;font-size:16px}
.edge i::before{content:"→"}
.loop{font-size:14px;font-weight:600;color:var(--accent);text-align:center}

/* 표 */
.tbl{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow-x:auto}
.tbl-cap{padding:10px 16px;font-size:13.5px;font-weight:700;border-bottom:1px solid var(--line)}
.tbl-cap.blue{color:var(--blue)} .tbl-cap.accent{color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.55}
th,td{padding:9px 16px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--shelf);white-space:nowrap}
tr:last-child td{border-bottom:0}
td code{white-space:nowrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:start}
.cols>div{min-width:0;display:flex;flex-direction:column;gap:14px}

/* 탭 */
.tabs{display:flex;flex-direction:column;gap:10px}
.tab-bar{display:inline-flex;align-self:flex-start;padding:3px;border-radius:10px;background:var(--shelf)}
.tab-bar button{border:0;background:none;padding:5px 16px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.tab-bar button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(22,32,46,.16)}
.tab-pane{display:flex;flex-direction:column;gap:14px}

/* 짝 · 비교 · 공식 */
.pairs{display:flex;flex-direction:column;gap:8px}
.pairs-head,.pair{display:grid;grid-template-columns:minmax(0,1.15fr) 28px minmax(0,1fr);gap:10px;align-items:center}
.pairs-head{font-size:12.5px;font-weight:600;color:var(--ink-3)}
.pl{display:flex;flex-direction:column;gap:4px;min-width:0}
.pl code.blk{display:block;padding:10px 14px;border-radius:10px;background:var(--navy);color:var(--on-navy);font-size:13px}
.pl small{font-size:13px;color:var(--ink-2);line-height:1.5}
.arr{text-align:center;color:var(--ink-3)} .arr::before{content:"→"}
.pr{font-weight:600;line-height:1.5;min-width:0}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.cmp{display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:12px;background:var(--shelf)}
.cmp.good{background:var(--card);border:2px solid var(--accent-fill)}
.cmp small{font-size:12.5px;font-weight:700;color:var(--ink-3)} .cmp.good small{color:var(--accent)}
.cmp q{quotes:none;font-size:16.5px;font-weight:500;line-height:1.6}
.cmp span{font-size:13.5px;color:var(--ink-2)}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:600}
.formula b{padding:7px 16px;border-radius:999px;background:var(--accent-tint);color:var(--accent);font-size:15px}
.formula i{font-style:normal;color:var(--ink-3);font-size:18px}

/* 순서 · 체크 · 해 보기 · 질문과 답 · 폴더 */
.steps-h{font-size:13px;font-weight:700;color:var(--ink-2)}
ol.steps{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px;max-width:46em}
ol.steps li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start}
ol.steps li>b{display:flex;align-items:center;justify-content:center;width:26px;height:26px;margin-top:1px;border-radius:50%;background:var(--strong);color:var(--on-navy);font-size:13px;font-family:var(--f-display)}
.check{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.chk{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.chk h4{margin:0 0 6px;font-size:13px;font-weight:700}
.chk.ok h4{color:var(--ok)} .chk.no h4{color:var(--no)}
.chk ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.chk li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px}
.chk li::before{content:"";width:9px;height:9px;margin-top:9px;border-radius:50%}
.chk.ok li::before{background:var(--ok)} .chk.no li::before{border:2px solid var(--no)}
.try{display:flex;flex-direction:column;gap:6px;max-width:46em}
.try-h{font-size:13px;font-weight:700;color:var(--ink-2)}
.try-i{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px 9px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:14.5px;line-height:1.55}
.copy{border:1px solid var(--line);background:var(--shelf);border-radius:8px;padding:4px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--ink-2)}
.copy:hover{border-color:var(--accent-fill);color:var(--ink)}
.qa{display:flex;flex-direction:column;gap:10px}
.qa-i{padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.qa-i h4{margin:0 0 4px;font-size:15px;font-weight:700;line-height:1.5}
.qa-i p{font-size:14.5px;color:var(--ink-2)}
.tree{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px 6px}
.tree-root{padding:2px 12px 6px;font-family:var(--f-mono);font-size:13.5px;font-weight:600;color:var(--accent)}
.tree a{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:4px 14px;padding:5px 12px;border-radius:8px;text-decoration:none;font-size:14px;line-height:1.45}
.tree a:hover{background:var(--shelf)}
.tree a b{font-family:var(--f-mono);font-size:13px;font-weight:500;overflow-wrap:anywhere}
.tree a b::before{content:"├─ ";color:var(--ink-3)}
.tree a:last-child b::before{content:"└─ "}
.tree a span{color:var(--ink-2)}
.built{display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-radius:12px;background:var(--shelf)}
.built .tag{padding:3px 12px;border-radius:999px;background:var(--accent-tint);font-size:12.5px}
.built.demo .tag,.built.next .tag{background:var(--blue-tint);color:var(--blue)}
.built strong{font-family:var(--f-display);font-size:18px;line-height:1.45}
.built p{font-size:14.5px;color:var(--ink-2)}

/* 한눈에 보기 */
.road{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.road a{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);text-decoration:none;min-width:0}
.road a:hover{border-color:var(--accent-fill)}
.road a span{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.road small{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.road b{font-family:var(--f-display);font-size:15px}
.road a.last{background:var(--strong);border-color:var(--strong);color:var(--on-navy)} .road a.last small{color:var(--k-kw)}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.how{display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.how h4{margin:0;font-family:var(--f-display);font-size:15.5px}
.how p{font-size:14px;color:var(--ink-2)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:8px;padding-top:24px;border-top:1px solid var(--line)}
.pager a{display:flex;flex-direction:column;padding:10px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-decoration:none;font-weight:600;max-width:48%;line-height:1.4}
.pager a small{font-size:11.5px;font-weight:600;color:var(--ink-3)}
.pager a:hover{border-color:var(--accent-fill)}
.pager .next{margin-left:auto;text-align:right}

/* 개념 사전 */
.dict-g{display:flex;flex-direction:column;gap:10px;padding:26px 0;border-top:1px solid var(--line)}
.dict-g h2{font-family:var(--f-display);font-size:19px}
.dict{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.dict-i{display:flex;flex-direction:column;gap:2px;height:100%;padding:11px 14px;border:1px dashed var(--ink-3);border-radius:12px;text-decoration:none;line-height:1.5}
.dict-i strong{color:var(--accent);font-size:15px}
.dict-i span{font-size:13px;color:var(--ink-2)}
.dict-i:hover,.dict-i.on{background:var(--accent-tint);border-style:solid;border-color:var(--accent-fill)}

/* ── 오른쪽: 개념 창 ── */
.panel-bar{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;background:var(--card);font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-3);z-index:1}
.panel-bar .x{display:none;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;letter-spacing:0;color:var(--ink)}
#panel-body{display:flex;flex-direction:column;gap:12px}
#panel-body.swap{animation:drop .25s ease-out}
.c-title{display:flex;align-items:center;gap:12px}
.c-title h2{font-family:var(--f-display);font-size:22px;line-height:1.3}
.c-short{font-size:16px;font-weight:500;line-height:1.65}
.c-body{font-size:14.5px;color:var(--ink-2)}
#panel-body h3{margin-top:8px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.where{list-style:none;padding:0;display:flex;flex-direction:column;gap:4px}
.where-i{display:flex;flex-direction:column;padding:8px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;line-height:1.4;font-size:14px}
.where-i small{font-size:11.5px;font-weight:600;color:var(--accent)}
.where-i:hover{border-color:var(--blue);background:var(--blue-tint)}
.where-i span::before{content:"→ ";color:var(--blue)}
.p-empty{display:flex;flex-direction:column;gap:12px;color:var(--ink-2);font-size:14.5px}

/* ── 화면이 좁을 때 ── */
@media (max-width:1240px){
  .app{grid-template-columns:240px minmax(0,1fr)}
  .panel{position:fixed;top:0;right:0;bottom:0;height:auto;width:min(390px,92vw);transform:translateX(105%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
  .panel.open{transform:none;visibility:visible;transition:transform .22s ease,visibility 0s}
  .panel-bar .x{display:block}
}
@media (min-width:1241px){ .scrim{display:none!important} }
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;overflow:visible;gap:10px;padding:10px 16px 10px;border-right:0;border-bottom:1px solid var(--line)}
  .rail-top{align-items:center}
  .brand{flex-direction:row;align-items:baseline;gap:8px}
  .brand strong{font-size:17px} .brand small{font-size:10px}
  .theme{width:30px;height:30px}
  .nav{flex-direction:row;gap:6px;overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav-group,.route{flex-direction:row;gap:6px;padding:0}
  .route::before{display:none}
  .nav-btn{flex:0 0 auto;width:auto;padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;white-space:nowrap;background:var(--card)}
  .stop .dot{display:none}
  .stop .st{flex-direction:row;gap:6px;align-items:baseline}
  .trail{position:static}
  .topic{scroll-margin-top:150px}
  .panel{top:auto;left:0;right:0;width:auto;max-height:74vh;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(105%);padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));padding-top:0}
  .pairs-head{display:none}
  .pair{grid-template-columns:minmax(0,1fr);gap:4px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  .arr::before{content:"↓"}
  .flow{flex-direction:column}
  .node{flex:0 0 auto;flex-direction:row;justify-content:flex-start;text-align:left;padding:10px 14px;gap:12px}
  .node strong{flex:1}
  .edge{flex-direction:row;gap:6px} .edge i::before{content:"↓"}
  .pager a{max-width:none;flex:1}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .topic.arrive,.ln.lit,.cmt.show,#panel-body.swap{animation:none}
  .panel{transition:none}
}

{id:'s-narrow', sec:'data', eb:'STEP 1–2 · SQL 기초', title:'한 줄씩 붙여 가며 질문을 좁히기', blocks:[

{id:'s-real', sec:'data', eb:'STEP 1–2 · SQL', title:'참고하기 : step2 파일 속 실제 질문', blocks:[
  {k:'note', kind:'tip', t:R`step2_explore_db.py 속 질문: 앞으로 7일 안에 마감인 할 일은?`},
  {k:'code', file:'step2_explore_db.py 속 SQL', lang:'sql', lines:[
    [R`SELECT t.id, p.name AS project, t.title, t.due_date`, R`보여 줄 칸을 고릅니다. t와 p는 표 이름을 줄여 부르는 별명이고, AS project는 결과 칸의 이름을 project로 바꿉니다.`],
    [R`FROM tasks t JOIN projects p ON p.id = t.project_id`, R`[[join|JOIN]]: tasks와 projects 두 표를 같은 번호끼리 짝지어 잇습니다. 할 일마다 프로젝트 이름이 붙습니다.`],
    [R`WHERE t.status != '완료'`, R`완료하지 않은 할 일만 남깁니다. != 는 '다르다'입니다.`],
    [R`  AND t.due_date BETWEEN date('now', 'localtime')`, R`마감일이 오늘부터`],
    [R`                     AND date('now', 'localtime', '+7 day')`, R`7일 뒤 사이인 것만 남깁니다. 날짜가 'YYYY-MM-DD' 글자로 저장되어 있어서 글자 비교만으로 앞뒤를 가릅니다.`],
    [R`ORDER BY t.due_date;`, R`[[orderby|마감 빠른 순]]으로 정렬합니다.`],
  ]},
  {k:'table', head:['id','project','title','due_date'], rows:[
    ['2','블로그 리뉴얼','카테고리 구조 다시 짜기','오늘 + 2일'],
    ['10','정보처리기사 준비','데이터베이스 과목 복습','오늘 + 4일'],
    ['11','정보처리기사 준비','실기 프로그래밍 문제 정리','오늘 + 6일'],
  ]},
  {k:'p', t:R`파일 안에서는 이 문장이 파이썬 문자열로 들어가 sqlite3로 실행됩니다. 사람이 자주 묻는 질문 하나가 SQL 하나로 바뀐다는 감각이 핵심입니다. 이 질문은 나중에 <<list_tasks(due_within_days=7)>> 도구가 됩니다.`},
], rel:['s-map','m-detail']},
{id:'s-map', sec:'data', eb:'STEP 1–2 · 데이터', title:'질문 → SQL → 도구', blocks:[

/* 강의 도우미: 섹션 이동 · 개념 창 · 코드 줄 설명 · 지나온 길 · 찾기
   자료(CONCEPTS, SECTIONS, TOPICS)와 아이콘(IMG)은 이 파일 앞에 붙는다. */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const CMAP = Object.fromEntries(CONCEPTS.map(c => [c.id, c]));
const TMAP = Object.fromEntries(TOPICS.map(t => [t.id, t]));
const SMAP = Object.fromEntries(SECTIONS.map(s => [s.id, s]));
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 저장이 안 되어도 동작에는 지장 없음 */ } },
};
const secTag = sec => (sec.step ? sec.step + ' · ' + sec.label : sec.label);

/* ── 글 속 표기 → 링크 ── */
const RX = /\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]|\{\{([a-z0-9-]+)(?:\|([^}]+))?\}\}|<<(.+?)>>|\*\*(.+?)\*\*/g;
function fmt(s, nolink) {

const RX_JSON = /("(?:[^"\\]|\\.)*")(\s*:)?/g;

  if (lang === 'py') return tok(code, RX_PY, m => (m[1] ? 'm' : m[2] ? 's' : m[3] ? 'd' : PY_KW.has(m[4]) ? 'k' : ''));

    + '<h3>먼저 볼 만한 개념</h3><div class="chips">'

    + '</div><div class="chips"><a class="chip" href="#dict" data-sec="dict">개념 사전 전체 보기</a></div></div>';
}

/* ── 상태와 이동 ── */
const nav = $('#nav'), view = $('#view'), trail = $('#trail'), panel = $('#panel'), body = $('#panel-body'), scrim = $('#scrim');
const q = $('#q'), results = $('#results');
const narrowMq = window.matchMedia('(max-width:1240px)');
const state = {
  sec: null, concept: null, trigger: null, trail: [], hits: [], sel: -1,
  os: store.get('helper-os') || (/Win/i.test(navigator.userAgent) ? 'Windows' : 'macOS'),
};
const setHash = h => { try { history.replaceState(null, '', '#' + h); } catch (e) { /* 미리보기 환경에서는 주소를 못 바꿀 수 있음 */ } };
const syncPanel = () => { panel.inert = narrowMq.matches && !panel.classList.contains('open'); };

function syncNav() {
  $$('.nav-btn', nav).forEach(b => {
    const on = b.dataset.sec === state.sec;
    if (on) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current');
    if (on && nav.scrollWidth > nav.clientWidth) {
      nav.scrollLeft += b.getBoundingClientRect().left - nav.getBoundingClientRect().left - (nav.clientWidth - b.offsetWidth) / 2;
    }
  });
}
function markLinks() {
  $$('.cl.on,.dict-i.on').forEach(a => a.classList.remove('on'));
  if (state.concept) $$(`.cl[data-c="${state.concept}"],.dict-i[data-c="${state.concept}"]`, view).forEach(a => a.classList.add('on'));
}
function renderTrail() {
  const items = state.trail.slice(-6), off = state.trail.length - items.length;
  trail.innerHTML = `<button class="back" type="button" data-act="back"${state.trail.length < 2 ? ' disabled' : ''}>← 이전</button><span class="tr-h">지나온 길</span>`
    + items.map((e, i) => {
      const label = e.k === 's' ? SMAP[e.id].label : e.k === 't' ? TMAP[e.id].title : CMAP[e.id].name;
      return (i ? '<span class="sep" aria-hidden="true">›</span>' : '')
        + `<button class="tr${e.k === 'c' ? ' c' : ''}${i === items.length - 1 ? ' cur' : ''}" type="button" data-trail="${off + i}" title="${esc(label)}">${esc(label)}</button>`;
    }).join('');
  trail.scrollLeft = trail.scrollWidth;
}
function pushTrail(k, id) {
  const last = state.trail[state.trail.length - 1];
  if (!(last && last.k === k && last.id === id)) {
    state.trail.push({ k, id });
    if (state.trail.length > 40) state.trail.shift();
  }
  renderTrail();
}
function showSection(sid, silent, keepScroll) {
  const sec = SMAP[sid];
  if (!sec) return;
  if (state.sec !== sid) {
    state.sec = sid;
    view.innerHTML = renderSection(sec);
    syncNav();
    markLinks();
  }
  if (!keepScroll) window.scrollTo({ top: 0, behavior: 'instant' });
  if (!silent) { pushTrail('s', sid); setHash(sid); }
}
function goTopic(tid, silent) {
  const t = TMAP[tid];
  if (!t) return;
  showSection(t.sec, true, true);
  const el = document.getElementById(tid);
  if (!el) return;
  el.scrollIntoView({ block: 'start' });
  el.classList.remove('arrive'); void el.offsetWidth; el.classList.add('arrive');
  el.focus({ preventScroll: true });
  if (!silent) pushTrail('t', tid);
  setHash(tid);
}
function openConcept(id, trigger, silent) {
  const c = CMAP[id];
  if (!c) return;
  if (trigger && !panel.contains(trigger)) state.trigger = trigger;
  state.concept = id;
  renderConcept(c);
  panel.classList.add('open');
  panel.scrollTop = 0;
  syncPanel();
  if (narrowMq.matches) { scrim.hidden = false; $('.x', panel).focus({ preventScroll: true }); }
  markLinks();
  if (!silent) pushTrail('c', id);
  setHash('c-' + id);
}
function closePanel() {
  if (!panel.classList.contains('open')) return;
  panel.classList.remove('open');
  scrim.hidden = true;
  syncPanel();
  if (narrowMq.matches) {
    state.concept = null;
    markLinks();
    if (state.trigger && document.contains(state.trigger)) state.trigger.focus({ preventScroll: true });
  }
}
function visit(e) {
  if (e.k === 'c') { openConcept(e.id, null, true); return; }
  if (narrowMq.matches) closePanel();
  if (e.k === 's') { showSection(e.id, true); setHash(e.id); } else goTopic(e.id, true);
}
function route(h) {
  if (!h) return false;
  if (h.startsWith('c-') && CMAP[h.slice(2)]) { openConcept(h.slice(2)); return true; }
  if (TMAP[h]) { goTopic(h); return true; }
  if (SMAP[h]) { showSection(h); return true; }
  return false;
}

/* ── 코드 줄 설명 · 탭 · 복사 · 테마 ── */
function toggleLine(ln, force) {
  const cmt = ln.nextElementSibling;
  if (!cmt || !cmt.classList.contains('cmt')) return;
  const open = force === undefined ? cmt.hidden : force;
  cmt.hidden = !open;
  ln.classList.toggle('open', open);
  ln.setAttribute('aria-expanded', String(open));
  if (open) {
    ln.classList.remove('lit'); cmt.classList.remove('show'); void ln.offsetWidth;
    ln.classList.add('lit'); cmt.classList.add('show');
  }
}
function toggleAllNotes(btn) {
  const lines = $$('.ln.has-note', btn.closest('.code'));
  const open = lines.some(l => !l.classList.contains('open'));
  lines.forEach(l => toggleLine(l, open));
  btn.textContent = open ? '설명 모두 접기' : '설명 모두 펴기';
}
function selectTab(btn) {
  const label = btn.textContent;
  if (label === 'macOS' || label === 'Windows') { state.os = label; store.set('helper-os', label); }
  $$('.tabs', view).forEach(tabs => {
    const btns = $$(':scope > .tab-bar > button', tabs), panes = $$(':scope > .tab-pane', tabs);
    const i = btns.findIndex(b => b.textContent === label);
    if (i < 0) return;
    btns.forEach((b, j) => b.setAttribute('aria-selected', String(j === i)));
    panes.forEach((p, j) => { p.hidden = j !== i; });
  });
}
function copyText(text, btn) {
  if (!btn.dataset.label) btn.dataset.label = btn.textContent;
  const say = msg => { btn.textContent = msg; clearTimeout(btn._t); btn._t = setTimeout(() => { btn.textContent = btn.dataset.label; }, 1400); };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    say(ok ? '복사됨' : '직접 선택해 복사');
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => say('복사됨'), fallback);
  else fallback();
}
function toggleTheme() {
  const root = document.documentElement;
  const now = root.dataset.theme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = now === 'dark' ? 'light' : 'dark';
  root.dataset.theme = next;
  store.set('helper-theme', next);
}

/* ── 찾기 ── */
const SKIP = new Set(['k', 'lang', 'kind', 'to', 'tone', 'icon', 'xicon', 'w', 'mono', 'monoTag', 'dashed', 'start']);
function strings(o, acc) {
  if (typeof o === 'string') acc.push(plain(o));
  else if (Array.isArray(o)) o.forEach(v => strings(v, acc));
  else if (o && typeof o === 'object') for (const k in o) if (!SKIP.has(k)) strings(o[k], acc);
  return acc;
}
const INDEX = CONCEPTS.map(c => ({
  k: 'c', id: c.id, title: c.name, sub: '개념 · ' + c.g, head: c.name.toLowerCase(),
  hay: (c.name + ' ' + plain(c.short) + ' ' + plain(c.body || '')).toLowerCase(),
})).concat(TOPICS.map(t => ({
  k: 't', id: t.id, title: t.title, sub: secTag(SMAP[t.sec]), head: (t.title + ' ' + t.eb).toLowerCase(),
  hay: (t.title + ' ' + t.eb + ' ' + strings(t.blocks, []).join(' ')).toLowerCase(),
})));
function search(text) {
  const terms = text.toLowerCase().split(/\s+/).filter(Boolean);
  if (!terms.length) return [];
  return INDEX.map((it, i) => {
    if (!terms.every(w => it.hay.includes(w))) return null;
    return { it, score: (terms.every(w => it.head.includes(w)) ? 0 : 2) + (it.k === 't' ? 1 : 0), i };
  }).filter(Boolean).sort((a, b) => a.score - b.score || a.i - b.i).slice(0, 9).map(x => x.it);
}
function renderResults() {
  const text = q.value.trim();
  if (!text) { hideResults(); return; }
  state.hits = search(text);
  state.sel = state.hits.length ? 0 : -1;
  results.hidden = false;
  results.innerHTML = state.hits.length
    ? state.hits.map((h, i) => `<button class="res${h.k === 'c' ? ' c' : ''}${i === 0 ? ' sel' : ''}" type="button" data-res="${i}"><span>${esc(h.title)}</span><small>${esc(h.sub)}</small></button>`).join('')
    : '<div class="res-none">찾는 내용이 없습니다. 다른 낱말로 찾아보세요.</div>';
}
function hideResults() { results.hidden = true; results.innerHTML = ''; state.hits = []; state.sel = -1; }
function pick(i) {
  const h = state.hits[i];
  if (!h) return;
  q.value = ''; hideResults(); q.blur();
  if (h.k === 'c') openConcept(h.id, q); else { if (narrowMq.matches) closePanel(); goTopic(h.id); }
}
function moveSel(d) {
  if (!state.hits.length) return;
  state.sel = (state.sel + d + state.hits.length) % state.hits.length;
  $$('.res', results).forEach((b, i) => { b.classList.toggle('sel', i === state.sel); if (i === state.sel) b.scrollIntoView({ block: 'nearest' }); });
}

/* ── 이벤트 ── */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-res],[data-c],[data-t],[data-sec],[data-act],[data-trail],[data-tab],.ln.has-note');
  if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  const d = el.dataset;
  if (d.res !== undefined) pick(+d.res);
  else if (d.c) openConcept(d.c, el);
  else if (d.t) { if (narrowMq.matches) closePanel(); goTopic(d.t); }
  else if (d.sec) { if (narrowMq.matches) closePanel(); showSection(d.sec); }
  else if (d.trail !== undefined) {
    const i = +d.trail;
    if (i < state.trail.length - 1) { state.trail.length = i + 1; renderTrail(); }
    visit(state.trail[i]);
  } else if (d.tab !== undefined) selectTab(el);
  else if (d.act === 'theme') toggleTheme();
  else if (d.act === 'close-panel') closePanel();
  else if (d.act === 'back') {
    if (state.trail.length < 2) return;
    state.trail.pop(); renderTrail();
    visit(state.trail[state.trail.length - 1]);
  } else if (d.act === 'copy') copyText(d.copy, el);
  else if (d.act === 'notes') toggleAllNotes(el);
  else if (el.classList.contains('has-note')) toggleLine(el);
});
document.addEventListener('keydown', e => {
  if (e.target === q) {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); pick(state.sel); }
    else if (e.key === 'Escape') { q.value = ''; hideResults(); }
    return;
  }
  if (e.key === 'Escape') { closePanel(); return; }
  const ln = e.target.closest ? e.target.closest('.ln.has-note') : null;
  if (ln && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleLine(ln); return; }
  if (e.key === '/' && !/^(INPUT|TEXTAREA)$/.test(e.target.tagName) && !e.metaKey && !e.ctrlKey) { e.preventDefault(); q.focus(); }
});
results.addEventListener('mousedown', e => e.preventDefault());
q.addEventListener('input', renderResults);
q.addEventListener('focus', renderResults);
$('.search').addEventListener('focusout', e => { if (!e.currentTarget.contains(e.relatedTarget)) setTimeout(hideResults, 120); });
window.addEventListener('hashchange', () => route(location.hash.slice(1)));
if (narrowMq.addEventListener) narrowMq.addEventListener('change', () => { if (!narrowMq.matches) scrim.hidden = true; syncPanel(); });

/* ── 시작 ── */
const savedTheme = store.get('helper-theme');
if (savedTheme === 'dark' || savedTheme === 'light') document.documentElement.dataset.theme = savedTheme;
renderNav();
renderEmpty();
syncPanel();
state.trail = [{ k: 's', id: 'map' }];
showSection('map', true);
renderTrail();
route(location.hash.slice(1));

})();
</script>

</body></html>
